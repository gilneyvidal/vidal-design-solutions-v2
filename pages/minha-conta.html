<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Vidal Design Solutions</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background: #f8fafc; font-family: var(--font-body); color: var(--gray-800); }
        .account-page-container { max-width: 1100px; margin: 40px auto 80px; padding: 0 20px; }
        
        .profile-card {
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 30px;
            box-shadow: var(--shadow-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
            border: 1px solid var(--gray-200);
        }
        .orders-card {
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 30px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
        }
        .account-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .account-table th { background: #0f172a; color: #fff; text-align: left; padding: 12px; }
        .account-table td { padding: 14px 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-recebido { background: #e0f2fe; color: #0284c7; }
        .status-aprovado { background: #fef9c3; color: #854d0e; }
        .status-produzindo { background: #ffedd5; color: #c2410c; }
        .status-transportando { background: #f3e8ff; color: #7e22ce; }
        .status-finalizado { background: #dcfce7; color: #16a34a; }
        .status-cancelado { background: #fee2e2; color: #dc2626; }
        
        .btn-pdf-client { background: #1e3a8a; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-wpp-client { background: #25d366; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: 4px; }
    </style>
</head>
<body>

    <header class="header scrolled" style="position: sticky; top: 0;">
        <div class="container header-content">
            <a href="../index.html">
                <img src="../logo_cabecalho.png" alt="Vidal Design Solutions" style="height: 50px;" onerror="this.src='../logo.png'">
            </a>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="../index.html" class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;">
                    <i class="fas fa-arrow-left"></i> Voltar ao Catálogo
                </a>
                <button onclick="window.AuthController.logout()" class="btn btn-secondary" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <main class="account-page-container">
        <!-- Cartão do Usuário -->
        <div class="profile-card">
            <div>
                <h1 id="client-name" style="margin: 0 0 6px 0; font-size: 24px; color: #0f172a;">Carregando perfil...</h1>
                <p id="client-email" style="margin: 0; color: #64748b; font-size: 14px;"></p>
                <div style="margin-top: 10px;">
                    <span id="client-role-badge" class="auth-status-pill badge-cliente">Verificando...</span>
                </div>
            </div>
            <div>
                <a href="carrinho.html" class="btn btn-primary">
                    <i class="fas fa-shopping-cart"></i> Ver Meu Carrinho
                </a>
            </div>
        </div>

        <!-- Lista de Pedidos com Rastreio -->
        <div class="orders-card">
            <h2 style="margin: 0; font-size: 20px; color: #0f172a;"><i class="fas fa-box-open"></i> Meus Pedidos & Orçamentos</h2>
            <p style="color: #64748b; font-size: 13px; margin: 6px 0 0 0;">Acompanhe o andamento de cada peça e baixe o PDF oficial com seu ID exclusivo.</p>

            <table class="account-table">
                <thead>
                    <tr>
                        <th>ID do Pedido</th>
                        <th>Data</th>
                        <th>Recebimento</th>
                        <th>Status da Produção</th>
                        <th>Valor Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="client-orders-tbody">
                    <tr><td colspan="6" style="text-align: center; padding: 25px; color: #64748b;">Buscando seus pedidos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        let clientOrders = [];
        let clientProfile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await window.AuthController.getCurrentUser();
            if (!user) {
                alert('Faça login com sua conta Google para acessar sua área exclusiva.');
                window.AuthController.loginWithGoogle();
                return;
            }

            clientProfile = await window.AuthController.getUserProfile(user.id);
            document.getElementById('client-name').textContent = clientProfile?.full_name || user.user_metadata?.full_name || 'Cliente';
            document.getElementById('client-email').textContent = user.email;

            const badge = document.getElementById('client-role-badge');
            if (clientProfile?.role === 'master') {
                badge.className = 'auth-status-pill badge-master';
                badge.textContent = '👑 Administrador Master';
            } else if (clientProfile?.role === 'revenda') {
                badge.className = 'auth-status-pill badge-revenda';
                badge.textContent = '⭐ Revenda Autorizada'; // SEM porcentagem
            } else {
                badge.className = 'auth-status-pill badge-cliente';
                badge.textContent = '✅ Cliente Final';     // SEM porcentagem
            }

            await loadMyOrders(user.id);
        });

        async function loadMyOrders(userId) {
            const tbody = document.getElementById('client-orders-tbody');
            try {
                const { data, error } = await window.supabaseClient
                    .from('v2_orders')
                    .select('*, items:v2_order_items(*)')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                clientOrders = data || [];

                if (!clientOrders.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">Você ainda não realizou nenhum pedido.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                clientOrders.forEach(order => {
                    const tr = document.createElement('tr');
                    const statusClass = `status-${order.status}`;
                    tr.innerHTML = `
                        <td><strong>${order.order_code}</strong></td>
                        <td>${new Date(order.created_at).toLocaleDateString('pt-BR')}</td>
                        <td>${order.delivery_type.toUpperCase()}</td>
                        <td><span class="status-pill ${statusClass}">${order.status.toUpperCase()}</span></td>
                        <td><strong>${Number(order.total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></td>
                        <td>
                            <button class="btn-pdf-client" onclick="downloadClientPDF('${order.id}')">
                                <i class="fas fa-file-pdf"></i> Baixar PDF
                            </button>
                            <a href="https://wa.me/5511968649673?text=${encodeURIComponent('Olá! Gostaria de informações sobre meu pedido ' + order.order_code)}" target="_blank" class="btn-wpp-client" title="Falar no WhatsApp">
                                <i class="fab fa-whatsapp"></i>
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef4444;">Erro ao carregar seus pedidos.</td></tr>';
            }
        }

        function downloadClientPDF(orderId) {
            const order = clientOrders.find(o => o.id === orderId);
            if (!order) return;

            const printWindow = window.open('', '_blank');
            const items = order.items && order.items.length > 0 ? order.items : [
                { product_name: 'Material Gráfico / Comunicação Visual', quantity: 1, unit_price: order.subtotal || order.total, item_total: order.total }
            ];

            let itemsRows = '';
            items.forEach((it, idx) => {
                itemsRows += `
                    <tr>
                        <td style="padding:10px; border:1px solid #e2e8f0;">${idx + 1}</td>
                        <td style="padding:10px; border:1px solid #e2e8f0;"><strong>${it.product_name}</strong></td>
                        <td style="padding:10px; text-align:center; border:1px solid #e2e8f0;">${it.quantity}</td>
                        <td style="padding:10px; text-align:right; border:1px solid #e2e8f0;">${Number(it.unit_price).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                        <td style="padding:10px; text-align:right; border:1px solid #e2e8f0;"><strong>${Number(it.item_total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></td>
                    </tr>
                `;
            });

            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="pt-BR">
                <head>
                    <meta charset="UTF-8">
                    <title>Pedido_${order.order_code}</title>
                    <style>
                        @page { size: A4 portrait; margin: 12mm; }
                        body { font-family: 'Segoe UI', Arial, sans-serif; color: #1e293b; margin: 0; padding: 20px; }
                    </style>
                </head>
                <body>
                    <div style="max-width: 800px; margin: 0 auto;">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #f97316; padding-bottom:15px; margin-bottom:25px;">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <img src="../logo_cabecalho.png" style="height:55px; max-width:220px; object-fit:contain;" onerror="this.src='../logo.png'">
                                <div>
                                    <h1 style="margin:0; color:#1e3a8a; font-size:20px; font-weight:800;">VIDAL DESIGN SOLUTIONS</h1>
                                    <p style="margin:2px 0 0 0; color:#64748b; font-size:12px;">Comunicação Visual, Sinalização, Toldos e Impressão Digital</p>
                                    <p style="margin:2px 0 0 0; color:#64748b; font-size:12px;">Mogi das Cruzes - SP | Tel/WhatsApp: (11) 96864-9673</p>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:13px; font-weight:800; color:#ea580c;">ORÇAMENTO / PEDIDO</div>
                                <div style="font-size:18px; font-weight:800; color:#0f172a;">${order.order_code}</div>
                                <div style="font-size:11px; color:#94a3b8;">Data: ${new Date(order.created_at).toLocaleString('pt-BR')}</div>
                            </div>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:15px; margin-bottom:20px; font-size:13px;">
                            <div>
                                <strong>CLIENTE:</strong> ${clientProfile?.full_name || 'Cliente'}<br>
                                <strong>E-MAIL:</strong> ${clientProfile?.email || '-'}<br>
                                <strong>TELEFONE:</strong> ${clientProfile?.phone || '-'}
                            </div>
                            <div>
                                <strong>RECEBIMENTO:</strong> ${order.delivery_type.toUpperCase()}<br>
                                <strong>CANAL:</strong> ${order.payment_method ? order.payment_method.toUpperCase() : 'WHATSAPP'}<br>
                                <strong>STATUS:</strong> <span style="font-weight:bold; color:#16a34a;">${order.status.toUpperCase()}</span>
                            </div>
                        </div>

                        <h3 style="font-size:14px; text-transform:uppercase; margin-bottom:10px; color:#0f172a;">Itens & Especificações:</h3>
                        <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:20px;">
                            <thead>
                                <tr style="background:#0f172a; color:#fff;">
                                    <th style="padding:8px; text-align:left;">#</th>
                                    <th style="padding:8px; text-align:left;">Descrição da Peça</th>
                                    <th style="padding:8px; text-align:center;">Qtd</th>
                                    <th style="padding:8px; text-align:right;">Unitário</th>
                                    <th style="padding:8px; text-align:right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>${itemsRows}</tbody>
                        </table>

                        <div style="display:flex; justify-content:flex-end; margin-bottom:25px;">
                            <div style="width:280px; background:#fff7ed; padding:15px; border-radius:8px; border-left:4px solid #f97316; font-size:13px;">
                                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                    <span>Subtotal:</span>
                                    <strong>${Number(order.subtotal || order.total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong>
                                </div>
                                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                    <span>Taxa de Arte:</span>
                                    <strong>${Number(order.art_fee || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong>
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:bold; color:#c2410c; border-top:1px solid #fed7aa; padding-top:6px;">
                                    <span>VALOR TOTAL:</span>
                                    <span>${Number(order.total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                                </div>
                            </div>
                        </div>

                        <div style="border-top:1px solid #e2e8f0; padding-top:15px; font-size:11px; color:#64748b; text-align:center;">
                            Documento oficial emitido pela Vidal Design Solutions.<br>
                            Mogi das Cruzes - SP | (11) 96864-9673
                        </div>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => { printWindow.print(); }, 400);
        }
    </script>
</body>
</html>
